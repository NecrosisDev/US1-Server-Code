name: release
# Every push to main that passes the full check publishes the built server tree to the `release` branch, which the
# live server's tools/server/us1_update.sh pulls at each restart. A failing check publishes nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GLUALINT_VERSION: "1.29.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install glualint
        run: |
          curl -sSL -o gl.zip "https://github.com/FPtje/GLuaFixer/releases/download/${GLUALINT_VERSION}/glualint-${GLUALINT_VERSION}-x86_64-linux.zip"
          unzip -q gl.zip -d "$HOME/bin"
          echo "GLUALINT=$HOME/bin/glualint" >> "$GITHUB_ENV"
      - name: Install LuaJIT
        run: sudo apt-get install -y -q luajit
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Cache upstream checkouts
        uses: actions/cache@v4
        with:
          path: .cache/upstream
          key: upstream-${{ hashFiles('manifests/dependencies.json') }}
      - name: Build and check
        run: python tools/build.py --check
      - name: Strict check
        run: python tools/check.py --dist --strict
      - name: Publish to the release branch
        run: |
          set -e
          git config --global user.name "us1-release"
          git config --global user.email "us1-release@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin release >/dev/null; then
            git fetch -q --depth 1 origin release
            git worktree add -q ../release FETCH_HEAD
            git -C ../release checkout -q -B release
          else
            git worktree add -q --detach ../release
            git -C ../release checkout -q --orphan release
            git -C ../release rm -rq --cached . || true
          fi
          python tools/release.py ../release --main "$GITHUB_SHA"
          cd ../release
          git add -A
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -q -m "release ${GITHUB_SHA::7}" -m "Built from main ${GITHUB_SHA}."
          git push -q origin release
